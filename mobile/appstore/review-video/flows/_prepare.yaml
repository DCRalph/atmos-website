appId: nz.co.atmosmedia.app
---
# Not recorded: a cold start, signed out, on Home.
- stopApp
- launchApp
- tapOn: "More"
# A saved session takes a moment to restore after launch; until it does the
# screen reads as signed out.
- extendedWaitUntil:
    visible: "SIGN OUT"
    timeout: 8000
    optional: true
- runFlow:
    when:
      visible: "SIGN OUT"
    commands:
      - tapOn: "SIGN OUT"
- tapOn: "Home"
