appId: nz.co.atmosmedia.app
---
# Close checkout, which releases the hold.
- runFlow:
    when:
      visible: "PAYMENT"
    commands:
      - tapOn:
          point: "6%,16%"
- tapOn: "More"
- runFlow: _pause.yaml
- tapOn: "DELETE ACCOUNT"
- runFlow: _pause.yaml
- tapOn: "Back"
- runFlow: _beat.yaml
- tapOn: "SIGN OUT"
- runFlow: _beat.yaml
