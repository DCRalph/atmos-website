appId: nz.co.atmosmedia.app
---
- runFlow: _pause.yaml
# The order's second ticket, then back to the first.
- swipe:
    start: 75%, 42%
    end: 20%, 42%
    duration: 700
- runFlow: _pause.yaml
- swipe:
    start: 20%, 42%
    end: 75%, 42%
    duration: 700
- runFlow: _beat.yaml
- tapOn: "ADD TO APPLE WALLET"
- extendedWaitUntil:
    visible: "zz-never-zz"
    timeout: 5000
    optional: true
# Wallet's own sheet, which Maestro cannot see into: Add is top right.
- tapOn:
    point: "88%,10%"
- runFlow: _pause.yaml
