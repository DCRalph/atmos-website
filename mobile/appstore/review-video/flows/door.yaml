appId: nz.co.atmosmedia.app
---
- tapOn: "DOOR MODE"
- runFlow: _beat.yaml
# Name the handset, which every scan from it is tagged with.
- runFlow:
    when:
      visible: "Front door"
    commands:
      - tapOn: "Front door"
      - inputText: "Door 1"
      - tapOn: "TONIGHT"
      - runFlow: _beat.yaml
- tapOn: ".*Atmos Demo Night.*"
# The scanner. A simulator has no camera, so the feed is black.
- runFlow: _pause.yaml
- runFlow: _beat.yaml
- tapOn: "TYPE NUMBER"
- tapOn: "ATN-4F7K2X-03"
# The customer account's own ticket, as shown in the tickets segment.
- inputText: ${TICKET}
- tapOn: "LOOK IT UP"
- runFlow: _pause.yaml
- runFlow: _beat.yaml
- tapOn: "NEXT"
- tapOn: "List"
- runFlow: _pause.yaml
- tapOn: "Name, email or order number"
- inputText: "Grace"
- runFlow: _beat.yaml
# The first tap only closes the keyboard.
- tapOn: "Admit"
- runFlow:
    when:
      visible: "Admit"
    commands:
      - tapOn: "Admit"
- runFlow: _pause.yaml
- tapOn: "NEXT"
# The tabs scroll sideways; Log is off the end from List.
- swipe:
    start: 80%, 17%
    end: 25%, 17%
    duration: 500
- tapOn: "Log"
- runFlow: _pause.yaml
