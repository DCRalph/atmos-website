<!--
  "Add to Apple Wallet" badge.

  Apple requires its own artwork for this badge and asks that it is not
  recreated. This file is a stand-in drawn to Apple's proportions and lockup so
  the button is right everywhere else; replace this one file with the official
  SVG from Apple's "Add to Apple Wallet" guidelines and nothing else needs to
  change. The outlined variant is used because the badge sits on black.

  Guidelines and artwork:
  https://developer.apple.com/wallet/add-to-apple-wallet-guidelines/
-->
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="76" viewBox="0 0 240 76"
     role="img" aria-label="Add to Apple Wallet">
  <rect x="0.75" y="0.75" width="238.5" height="74.5" rx="12.5"
        fill="#000000" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.45"/>
  <g transform="translate(18 19)">
    <rect x="0" y="9" width="44" height="30" rx="5.5" fill="#ffffff"/>
    <rect x="5" y="2" width="10" height="10" rx="2" fill="#F5A524"/>
    <rect x="17" y="0" width="10" height="12" rx="2" fill="#EF4444"/>
    <rect x="29" y="3" width="10" height="9" rx="2" fill="#34D399"/>
    <rect x="0" y="20" width="44" height="3.5" fill="#000000" fill-opacity="0.12"/>
  </g>
  <text x="76" y="33" font-family="-apple-system,Helvetica Neue,Helvetica,Arial,sans-serif"
        font-size="15" fill="#ffffff" letter-spacing="0.2">Add to</text>
  <text x="76" y="57" font-family="-apple-system,Helvetica Neue,Helvetica,Arial,sans-serif"
        font-size="21" font-weight="600" fill="#ffffff" letter-spacing="0.1">Apple Wallet</text>
</svg>
